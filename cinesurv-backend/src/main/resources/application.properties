# ===================================================================
# DEFAULT PROFILE - H2 in-memory database
# Zero setup required. Great for development and demos where you
# don't want to depend on a locally installed PostgreSQL instance.
# Data resets every time the app restarts.
# ===================================================================

server.port=8080

spring.datasource.url=jdbc:h2:mem:cinesurv;DB_CLOSE_DELAY=-1
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# Browse the live DB in a browser at http://localhost:8080/h2-console
# JDBC URL to paste in: jdbc:h2:mem:cinesurv
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console