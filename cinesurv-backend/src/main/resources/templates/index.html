<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Cinesurv - Security Dashboard</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/sockjs-client/1.6.1/sockjs.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/stomp.js/2.3.3/stomp.min.js"></script>
    <style>
        :root {
          --bg: #0b0d12;
          --panel: #12151c;
          --border: #232733;
          --accent: #e11d48;
          --accent-soft: #7f1d3320;
          --text: #e5e7eb;
          --muted: #8b93a5;
          --good: #22c55e;
        }
        * { box-sizing: border-box; }
        body {
          margin: 0;
          background: var(--bg);
          color: var(--text);
          font-family: -apple-system, "Segoe UI", Roboto, sans-serif;
          padding: 24px;
        }
        header {
          display: flex;
          justify-content: space-between;
          align-items: center;
          margin-bottom: 20px;
        }
        header h1 {
          font-size: 20px;
          margin: 0;
          letter-spacing: 0.5px;
        }
        header h1 span { color: var(--accent); }
        .status-pill {
          display: inline-flex;
          align-items: center;
          gap: 6px;
          font-size: 13px;
          color: var(--muted);
          padding: 6px 12px;
          border: 1px solid var(--border);
          border-radius: 20px;
        }
        .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--good); }
        .dot.off { background: var(--accent); }

        .stats {
          display: grid;
          grid-template-columns: repeat(4, 1fr);
          gap: 14px;
          margin-bottom: 20px;
        }
        .stat-card {
          background: var(--panel);
          border: 1px solid var(--border);
          border-radius: 10px;
          padding: 16px 18px;
        }
        .stat-card .label { color: var(--muted); font-size: 12px; text-transform: uppercase; letter-spacing: 0.5px; }
        .stat-card .value { font-size: 28px; font-weight: 600; margin-top: 4px; }

        .grid {
          display: grid;
          grid-template-columns: 1.4fr 1fr;
          gap: 16px;
        }
        .panel {
          background: var(--panel);
          border: 1px solid var(--border);
          border-radius: 10px;
          padding: 16px 18px;
        }
        .panel h2 {
          font-size: 14px;
          text-transform: uppercase;
          letter-spacing: 0.5px;
          color: var(--muted);
          margin: 0 0 12px 0;
        }

        table { width: 100%; border-collapse: collapse; font-size: 13px; }
        th { text-align: left; color: var(--muted); font-weight: 500; padding: 8px 6px; border-bottom: 1px solid var(--border); }
        td { padding: 10px 6px; border-bottom: 1px solid var(--border); }
        tr:last-child td { border-bottom: none; }

        .badge {
          display: inline-block;
          padding: 3px 10px;
          border-radius: 20px;
          font-size: 11px;
          font-weight: 600;
        }
        .badge.active { background: var(--accent-soft); color: var(--accent); }
        .badge.resolved { background: #14532d40; color: var(--good); }

        .resolve-btn {
          background: transparent;
          border: 1px solid var(--border);
          color: var(--muted);
          padding: 4px 10px;
          border-radius: 6px;
          cursor: pointer;
          font-size: 12px;
        }
        .resolve-btn:hover { border-color: var(--accent); color: var(--accent); }

        .empty { color: var(--muted); font-size: 13px; padding: 20px 0; text-align: center; }

        .new-flash { animation: flash 1.2s ease-out; }
        @keyframes flash {
          0% { background: var(--accent-soft); }
          100% { background: transparent; }
        }
    </style>
</head>
<body>

<header>
    <h1>CINE<span>SURV</span> — Real-Time Security Dashboard</h1>
    <div class="status-pill"><span class="dot off" id="connDot"></span><span id="connText">Connecting...</span></div>
</header>

<div class="stats">
    <div class="stat-card"><div class="label">Active Alerts</div><div class="value" id="statActive">-</div></div>
    <div class="stat-card"><div class="label">Detections Today</div><div class="value" id="statToday">-</div></div>
    <div class="stat-card"><div class="label">Total Logged</div><div class="value" id="statTotal">-</div></div>
    <div class="stat-card"><div class="label">Resolved</div><div class="value" id="statResolved">-</div></div>
</div>

<div class="grid">
    <div class="panel">
        <h2>Live Threat Feed</h2>
        <table>
            <thead>
            <tr><th>Time</th><th>Hall / Camera</th><th>Seat</th><th>Type</th><th>Confidence</th><th>Status</th><th></th></tr>
            </thead>
            <tbody id="alertTableBody">
            <tr><td colspan="7" class="empty">Waiting for detections...</td></tr>
            </tbody>
        </table>
    </div>

    <div class="panel">
        <h2>Recent Alert Log</h2>
        <div id="logList"></div>
    </div>
</div>

<script>
    const API_BASE = "http://localhost:8080/api/alerts";
    let allAlerts = [];

    function fmtTime(iso) {
      if (!iso) return "-";
      const d = new Date(iso);
      return d.toLocaleTimeString();
    }

    function renderTable() {
      const tbody = document.getElementById("alertTableBody");
      if (allAlerts.length === 0) {
        tbody.innerHTML = '<tr><td colspan="7" class="empty">Waiting for detections...</td></tr>';
        return;
      }
      tbody.innerHTML = allAlerts.slice(0, 25).map(a => `
        <tr>
          <td>${fmtTime(a.detectedAt)}</td>
          <td>${a.hallName || "-"} / ${a.cameraId || "-"}</td>
          <td>${a.seatCoordinate}</td>
          <td>${a.threatType}</td>
          <td>${a.confidence ? (a.confidence * 100).toFixed(1) + "%" : "-"}</td>
          <td><span class="badge ${a.status === 'ACTIVE' ? 'active' : 'resolved'}">${a.status}</span></td>
          <td>${a.status === 'ACTIVE' ? `<button class="resolve-btn" onclick="resolveAlert(${a.id})">Resolve</button>` : ""}</td>
        </tr>
      `).join("");
    }

    function renderLog() {
      const logDiv = document.getElementById("logList");
      logDiv.innerHTML = allAlerts.slice(0, 8).map(a => `
        <div style="padding:8px 0; border-bottom:1px solid var(--border); font-size:13px;">
          <div style="color: var(--accent); font-weight:600;">${a.threatType} detected</div>
          <div style="color: var(--muted); font-size:12px;">${a.hallName} · Seat ${a.seatCoordinate} · ${fmtTime(a.detectedAt)}</div>
        </div>
      `).join("") || '<div class="empty">No alerts yet</div>';
    }

    async function refreshStats() {
      const res = await fetch(`${API_BASE}/stats`);
      const stats = await res.json();
      document.getElementById("statActive").textContent = stats.activeAlerts;
      document.getElementById("statToday").textContent = stats.detectionsToday;
      document.getElementById("statTotal").textContent = stats.totalAlerts;
      document.getElementById("statResolved").textContent = stats.resolvedAlerts;
    }

    async function loadHistory() {
      const res = await fetch(`${API_BASE}/history`);
      allAlerts = await res.json();
      renderTable();
      renderLog();
      refreshStats();
    }

    async function resolveAlert(id) {
      await fetch(`${API_BASE}/${id}/resolve`, { method: "PUT" });
    }

    function addOrUpdateAlert(alert) {
      const idx = allAlerts.findIndex(a => a.id === alert.id);
      if (idx >= 0) {
        allAlerts[idx] = alert;
      } else {
        allAlerts.unshift(alert);
      }
      renderTable();
      renderLog();
      refreshStats();
    }

    function connectWebSocket() {
      const socket = new SockJS("http://localhost:8080/ws");
      const stompClient = Stomp.over(socket);
      stompClient.debug = null; // silence console spam

      stompClient.connect({}, () => {
        document.getElementById("connDot").classList.remove("off");
        document.getElementById("connText").textContent = "Live";

        stompClient.subscribe("/topic/live-threats", (msg) => {
          addOrUpdateAlert(JSON.parse(msg.body));
        });
        stompClient.subscribe("/topic/alert-updates", (msg) => {
          addOrUpdateAlert(JSON.parse(msg.body));
        });
      }, () => {
        document.getElementById("connDot").classList.add("off");
        document.getElementById("connText").textContent = "Disconnected - retrying...";
        setTimeout(connectWebSocket, 3000);
      });
    }

    loadHistory();
    connectWebSocket();
</script>

</body>
</html>
